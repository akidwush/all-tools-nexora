<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080312">
  <title>Feedback — All Tools Nexora</title>
  <style>
    :root{color-scheme:dark;--bg:#080312;--panel:#120922;--line:#321a50;--text:#f5edff;--muted:#ad99c7;--accent:#ad5cff;--green:#55db91;--red:#ff7d9c}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);font-family:Inter,Poppins,system-ui,sans-serif;color:var(--text)}
    body{background:radial-gradient(circle at 20% 0,rgba(173,92,255,.18),transparent 32%),var(--bg)}
    main{width:min(760px,100%);margin:auto;padding:clamp(16px,5vw,48px)}
    .hero,.panel{border:1px solid var(--line);background:rgba(18,9,34,.94);box-shadow:0 22px 75px rgba(0,0,0,.3)}
    .hero{padding:24px;border-radius:24px;margin-bottom:14px}.eyebrow{margin:0 0 7px;color:#ce9cff;font-size:.7rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase}
    h1{font-size:clamp(1.45rem,6vw,2.5rem);margin:0}.hero p:last-child{margin:10px 0 0;color:var(--muted);line-height:1.6;font-size:.88rem}
    .panel{padding:clamp(18px,4vw,28px);border-radius:24px}form{display:grid;gap:15px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    label{display:grid;gap:7px;color:#d9c8ed;font-size:.78rem;font-weight:750}input,select,textarea,button{font:inherit}
    input,select,textarea{width:100%;border:1px solid #3b225b;border-radius:13px;background:#0b0613;color:#fff;outline:0;padding:13px 14px}textarea{min-height:140px;resize:vertical;line-height:1.55}
    input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(173,92,255,.13)}
    button{min-height:48px;border:0;border-radius:14px;background:linear-gradient(135deg,#bb6cff,#7437e8);color:#fff;font-weight:900;cursor:pointer;box-shadow:0 14px 35px rgba(116,55,232,.3)}button:disabled{opacity:.6;cursor:wait}
    .trap{position:absolute!important;left:-9999px!important}.message{display:none;padding:12px 13px;border-radius:12px;font-size:.8rem;font-weight:750;line-height:1.5}.message.show{display:block}.message.ok{border:1px solid #2b6d49;background:#0e2b1c;color:#8ef3b7}.message.warn{border:1px solid #705a2b;background:#2b220e;color:#f3d88e}.message.error{border:1px solid #71334a;background:#2d101b;color:#ffadc0}
    .queue{margin-top:12px;color:#88749e;font-size:.72rem;text-align:center}
    @media(max-width:560px){.row{grid-template-columns:1fr}.hero,.panel{border-radius:19px}}
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <p class="eyebrow">Developer Dika</p>
      <h1>Report Bug, Saran &amp; Ide</h1>
      <p>Kirim detail yang jelas supaya masalah lebih mudah dilacak. Jika database belum diaktifkan, laporan diamankan sementara di perangkat ini dan dapat dikirim ulang nanti.</p>
    </section>
    <section class="panel">
      <form id="feedbackForm" novalidate>
        <div class="row">
          <label>Nama atau username<input id="name" name="name" minlength="3" maxlength="40" autocomplete="nickname" required placeholder="Contoh: alvena"></label>
          <label>Kategori<select id="category" name="category" required><option value="bug">Bug</option><option value="suggestion">Saran</option><option value="idea">Ide fitur</option><option value="other">Lainnya</option></select></label>
        </div>
        <label>Detail laporan<textarea id="message" name="message" minlength="5" maxlength="1000" required placeholder="Jelaskan fitur, langkah sebelum error, dan hasil yang muncul..."></textarea></label>
        <label class="trap" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label>
        <div id="result" class="message" role="status" aria-live="polite"></div>
        <button id="submit" type="submit">Kirim ke Developer Dika</button>
      </form>
      <div id="queue" class="queue"></div>
    </section>
  </main>
  <script>
    (() => {
      "use strict";
      const form = document.getElementById("feedbackForm");
      const result = document.getElementById("result");
      const submit = document.getElementById("submit");
      const queue = document.getElementById("queue");
      const storageKey = "all_tools_nexora_feedback_queue_v1";

      function readQueue() {
        try { const value = JSON.parse(localStorage.getItem(storageKey) || "[]"); return Array.isArray(value) ? value : []; }
        catch { return []; }
      }
      function writeQueue(items) {
        try { localStorage.setItem(storageKey, JSON.stringify(items.slice(-10))); } catch {}
        renderQueue();
      }
      function renderQueue() {
        const count = readQueue().length;
        queue.textContent = count ? `${count} laporan tersimpan sementara di perangkat.` : "";
      }
      function notice(text, type) {
        result.textContent = text;
        result.className = `message show ${type}`;
      }
      async function send(payload) {
        const response = await fetch("/api/feedback", {
          method: "POST",
          headers: { "Content-Type": "application/json", Accept: "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) { const error = new Error(data.message || "Pengiriman gagal."); error.code = data.error; throw error; }
        return data;
      }
      async function flushQueue() {
        const items = readQueue();
        if (!items.length) return;
        const pending = [];
        for (const item of items) {
          try { await send(item); } catch { pending.push(item); }
        }
        writeQueue(pending);
      }
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!form.reportValidity()) return;
        const payload = {
          name: form.name.value.trim(),
          category: form.category.value,
          message: form.message.value.trim(),
          website: form.website.value,
          clientTime: new Date().toISOString()
        };
        submit.disabled = true;
        result.className = "message";
        try {
          await send(payload);
          form.message.value = "";
          notice("Laporan berhasil dikirim. Terima kasih!", "ok");
        } catch (error) {
          if (error.code === "DATABASE_NOT_CONFIGURED" || !navigator.onLine) {
            writeQueue([...readQueue(), payload]);
            form.message.value = "";
            notice("Database belum aktif. Laporan sudah disimpan sementara di perangkat ini.", "warn");
          } else {
            notice(error.message || "Laporan belum dapat dikirim.", "error");
          }
        } finally { submit.disabled = false; }
      });
      window.addEventListener("online", flushQueue);
      renderQueue();
      if (navigator.onLine) flushQueue();
    })();
  </script>
</body>
</html>

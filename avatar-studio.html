<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f2ee">
  <meta name="description" content="Nexora Avatar Studio — editor visual avatar SVG berbasis DiceBear v10.">
  <title>Nexora Avatar Studio</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="/assets/config.js?v=6.4.0-avatar-studio4"></script>
  <script src="/assets/js/core/lazy-loader.js?v=6.4.0-avatar-studio4" defer></script>
  <style>
    :root{color-scheme:light dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f2ee;color:#25232a}@media(prefers-color-scheme:dark){html,body{background:#181719;color:#f3f0f4}}.as-boot{min-height:100vh;display:grid;place-items:center;padding:24px}.as-boot-card{display:grid;gap:10px;width:min(100%,460px);padding:28px;border:1px solid rgba(127,117,139,.22);border-radius:24px;background:color-mix(in srgb,Canvas 96%,transparent);box-shadow:0 20px 70px rgba(0,0,0,.10)}.as-boot-card b{font-size:1.15rem}.as-boot-card span{color:GrayText;line-height:1.6}.as-boot-dot{width:12px;height:12px;border-radius:50%;background:#6558d9;animation:asPulse 1s ease-in-out infinite alternate}@keyframes asPulse{to{transform:scale(.65);opacity:.45}}@media(prefers-reduced-motion:reduce){.as-boot-dot{animation:none}}
  </style>
</head>
<body>
  <div id="avatarStudioRoot">
    <div class="as-boot" role="status" aria-live="polite">
      <div class="as-boot-card"><i class="as-boot-dot"></i><b>Menyiapkan Nexora Avatar Studio</b><span>Memuat editor dan menghubungkan discovery DiceBear v10…</span></div>
    </div>
  </div>
  <script>
    window.addEventListener("DOMContentLoaded",async function(){
      var root=document.getElementById("avatarStudioRoot");
      try{
        if(!window.NexoraModules||typeof window.NexoraModules.ensure!=="function")throw new Error("Lazy module loader tidak tersedia.");
        await window.NexoraModules.ensure("avatar-studio");
        if(!window.NexoraAvatarStudio||typeof window.NexoraAvatarStudio.mount!=="function")throw new Error("Avatar Studio module tidak tersedia.");
        await window.NexoraAvatarStudio.mount(root);
      }catch(error){
        root.replaceChildren();
        var wrap=document.createElement("div");wrap.className="as-boot";
        var card=document.createElement("div");card.className="as-boot-card";
        var title=document.createElement("b");title.textContent="Avatar Studio belum dapat dimuat";
        var detail=document.createElement("span");detail.textContent=error&&error.message?error.message:"DiceBear sementara tidak tersedia.";
        var link=document.createElement("a");link.href="/";link.textContent="Kembali ke Nexora";link.style.color="#6558d9";
        card.append(title,detail,link);wrap.append(card);root.append(wrap);
      }
    },{once:true});
  </script>
</body>
</html>
